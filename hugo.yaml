baseurl: https://riemannhypothesis.blog/

publishdir: public
themesDir: themes

title: Understanding the Riemann Hypothesis
canonifyurls: true

DefaultContentLanguage: en
theme: beautifulhugo
metaDataFormat: yaml
enableRobotsTXT: true

Params:
  subtitle: Everything You Always Wanted to Know About Primes (But Were Afraid to Ask)
  mainSections:
    - post
    - posts
  logo: logo.png
  favicon: favicon.ico
  dateFormat: January 2, 2006
  commit: false
  rss: true
  comments: false
  readingTime: true
  wordCount: true
  useHLJS: true
  socialShare: true
  showRelatedPosts: true

  author:
    name: Markus Shepherd
    email: markus@recommend.games
    website: https://recommend.games/
    facebook: markus.r.shepherd
    gitlab: mshepherd
    github: MarkusShepherd
    twitter: MarkusRShepherd
    mastodon: 'tabletop.social/@markus'
    reddit: MarkusShepherd
    linkedin: markusschepke
    stackoverflow: users/2634131/markus-shepherd
    youtube: user/MarkusSchepke # or channel/channelname
    paypal: mschepke
    kaggle: mshepherd

markup:
  goldmark:
    renderer:
      unsafe: true


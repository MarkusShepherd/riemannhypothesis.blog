# Preserve tag-based recommendations with the v5 related-content engine.
related:
  includeNewer: true
  threshold: 80
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: keywords
      weight: 80
    - name: date
      weight: 10

# Hugo no longer publishes the legacy static symlinks. Mount the canonical
# PDFs at their historical URLs without storing a second copy of each file.
module:
  mounts:
    - source: static
      target: static
    - source: static/schepke_adding_prime_numbers.pdf
      target: static/wp-content/uploads/2014/10/schepke_adding_prime_numbers.pdf
    - source: static/schepke_distribution_of_squarefree_numbers_in_arithmetic_progressions.pdf
      target: static/wp-content/uploads/2014/10/schepke_distribution_of_squarefree_numbers_in_arithmetic_progressions.pdf
    - source: static/schepke_prime_generating_sequences.pdf
      target: static/wp-content/uploads/2014/10/schepke_prime_generating_sequences.pdf
    - source: static/schepke_primzahlerzeugende_folgen.pdf
      target: static/wp-content/uploads/2014/10/schepke_primzahlerzeugende_folgen.pdf
    - source: static/schepke_algebraic_number_theory.pdf
      target: static/wp-content/uploads/2014/12/schepke_algebraic_number_theory.pdf

sitemap:
  changefreq: weekly

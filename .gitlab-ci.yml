default:
  image:
    name: ghcr.io/gohugoio/hugo:v0.170.1
    entrypoint: [""]
  before_script:
    - hugo version

variables:
  GIT_SUBMODULE_STRATEGY: recursive

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

.build:
  script:
    - hugo --minify --panicOnWarning

test:
  extends: .build
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

deploy:
  extends: .build
  pages: true
  artifacts:
    paths:
      - public
    expire_in: 48 hours
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

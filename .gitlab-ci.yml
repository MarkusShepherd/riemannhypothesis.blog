image:
  name: ghcr.io/gohugoio/hugo:v0.170.1
  entrypoint: [""]

variables:
  GIT_SUBMODULE_STRATEGY: recursive

test:
  script:
  - hugo
  artifacts:
    expire_in: 1 hour
  except:
  - master

pages:
  script:
  - hugo
  artifacts:
    paths:
    - public
    expire_in: 1 week
  only:
  - master
